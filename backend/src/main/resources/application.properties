spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rzs_stats}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

rzs.neonsportz.base-url=https://neonsportz.com/api
rzs.neonsportz.league=RZS
rzs.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Sync cron: nightly at 4am Eastern (zone set on @Scheduled annotation, handles DST)
rzs.sync.cron=${SYNC_CRON:0 0 4 * * *}

# Caffeine cache: 24h safety TTL, write-through via @CacheEvict on sync
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

# Admin passcode: when set, /api/admin/** requires it in the X-Admin-Token header. Unset = open (local dev).
rzs.admin-token=${ADMIN_TOKEN:}

playoffs.simulations=20000

playoffs.nfl-comparison=false

rzs.sync.interval-minutes=${SYNC_INTERVAL_MINUTES:120}
